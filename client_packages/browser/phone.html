<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FiveUP Phone</title>
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="fonts/phone.css">
    <link rel="stylesheet" href="css/grids-min.css">
    <link rel="stylesheet" href="css/os.css">
    <script src="./js/phone/jquery.js"></script>
    <script src="./js/phone/vue.dev.js"></script>
    <script src="./js/phone/vuex.js"></script>
    <script src="./js/phone/vue-color.min.js"></script>
    <style>
        body {
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            font-family: "Ubuntu", sans-serif;
        }
    </style>
</head>
<body onload="startTime()">
    <div class="phone" style="opacity: 0">
        <!-- <div class="phone-speaker"></div>
        <div class="phone-camera"></div> -->
        <div class="phone-screen">
            <div class="bar">
			<div class="time" id="txt"></div>
			<div id="wifi"><img src="images/wifi.png" width="16" height="16"></div>
			<div id="battery"><img src="images/battery.png" width="20" height="20"></div>
                <!-- <div class="carrier"><p><script> document.write(new Date().toLocaleTimeString()); </script></div>
                <div class="carrier">Shelby</div>
                <div class="flaticon-silhouette battery"></div> -->
            </div>
            <div class="pure-g main"></div>
            <div class="navigation">
               <!-- <div class="back flaticon-arrows" onClick="back();"></div>
                <div class="home flaticon-square" onClick="home();"></div>
            </div>
             <div class="debug">AppID: </div> -->
            </div>
        </div>
    </div>
</body>
<script src="js/jquery-3.2.1.min.js"></script>
<script src="js/move.min.js"></script>
<script src='js/os.js'></script>
<script>

    function dynamicScriptLoad(a) {
        var b = document.createElement("script");
        b.setAttribute("src", a + "?r=" + Math.random()), document.head.appendChild(b)
    }

    function dynamicStyleLoad(a) {
        var b = document.createElement("link");
        b.setAttribute("rel", "stylesheet"),
            b.setAttribute("type", "text/css"),
            b.setAttribute("href", a + "?r=" + Math.random()),
            document.head.appendChild(b)
    }
    dynamicScriptLoad("./js/phone/smartphone.js")
</script>
</html>
